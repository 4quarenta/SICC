name: Deploy SICC to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sicc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply requested source changes
        shell: python
        run: |
          from pathlib import Path

          app = Path("app/sicc-app.tsx")
          s = app.read_text()
          replacements = [
              (
                  '<em>Nascimento: {formatDate(person.birthDate)} · {custodyStatusLabel[person.custodyStatus ?? "free"]} · {person.approachCount || 0} abordagem(ns)</em>',
                  '<em>{formatDate(person.birthDate)}</em><em>{person.motherName || "Mãe não informada"}</em>'
              ),
              (
                  '<FormSection title="Origem do registro" subtitle="A localização só é capturada quando o cadastro decorre de abordagem">',
                  '<FormSection title="Local de abordagem" subtitle="A localização só é capturada quando o cadastro decorre de abordagem">'
              ),
              (
                  '  motherName: string | null;\n  city: string | null;',
                  '  motherName: string | null;\n  tattooDescription: string | null;\n  city: string | null;'
              ),
              (
                  'const blankRegisterDraft = () => ({ fullName: "", nickname: "", cpf: "", birthDate: "", motherName: "", city: "", state: "PB", notes: "" });',
                  'const blankRegisterDraft = () => ({ fullName: "", nickname: "", cpf: "", birthDate: "", motherName: "", tattooDescription: "", city: "", state: "PB", notes: "" });'
              ),
              (
                  '<label>Nome da mãe<input name="motherName" value={registerDraft.motherName} onChange={(event) => setRegisterDraft((draft) => ({ ...draft, motherName: event.target.value }))} placeholder="Auxilia a confirmação de identidade" /></label>\n                <label className="wide">Descrição de tatuagens<textarea name="tattooDescription" rows={3} value={registerDraft.tattooDescription} onChange={(event) => setRegisterDraft((draft) => ({ ...draft, tattooDescription: event.target.value }))} placeholder="Ex.: coroa com nome Miguel no pescoço" /></label>\n                <div className="locality-fields">',
                  '<label>Nome da mãe<input name="motherName" value={registerDraft.motherName} onChange={(event) => setRegisterDraft((draft) => ({ ...draft, motherName: event.target.value }))} placeholder="Auxilia a confirmação de identidade" /></label>\n                <div className="locality-fields">'
              ),
              (
                  '<label>Nome da mãe<input name="motherName" defaultValue={person.motherName ?? ""} /></label>\n            <label className="wide">Descrição de tatuagens<textarea name="tattooDescription" rows={3} defaultValue={person.tattooDescription ?? ""} placeholder="Descreva tatuagens conhecidas" /></label>\n            <div className="locality-fields">',
                  '<label>Nome da mãe<input name="motherName" defaultValue={person.motherName ?? ""} /></label>\n            <div className="locality-fields">'
              ),
              (
                  '<div className="photo-record"><PhotoInput name="tattoos" label="Fotos de tatuagens" multiple /><label>Data das fotos<input name="tattooPhotoDate" type="date" defaultValue={currentBrasiliaDate()} /></label></div>\n              </div>\n            </FormSection>',
                  '<div className="photo-record"><PhotoInput name="tattoos" label="Fotos de tatuagens" multiple /><label>Data das fotos<input name="tattooPhotoDate" type="date" defaultValue={currentBrasiliaDate()} /></label></div>\n              </div>\n              <label className="wide">Descrição de tatuagens<textarea name="tattooDescription" rows={3} value={registerDraft.tattooDescription} onChange={(event) => setRegisterDraft((draft) => ({ ...draft, tattooDescription: event.target.value }))} placeholder="Ex.: coroa com nome Miguel no pescoço" /></label>\n            </FormSection>'
              ),
              (
                  '<div className="photo-record"><PhotoInput name="tattoos" label="Adicionar tatuagens" multiple /><label>Data das fotos<input name="tattooPhotoDate" type="date" defaultValue={currentBrasiliaDate()} /></label></div>\n          </div>',
                  '<div className="photo-record"><PhotoInput name="tattoos" label="Adicionar tatuagens" multiple /><label>Data das fotos<input name="tattooPhotoDate" type="date" defaultValue={currentBrasiliaDate()} /></label></div>\n          </div>\n          <label className="wide">Descrição de tatuagens<textarea name="tattooDescription" rows={3} defaultValue={person.tattooDescription ?? ""} placeholder="Descreva tatuagens conhecidas" /></label>'
              ),
          ]
          changed = False
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
          if changed:
              app.write_text(s)

          api = Path("supabase/functions/sicc-api/index.ts")
          a = api.read_text()
          api_replacements = [
              (
                  '    motherName: row.mother_name,\n    city: row.city,',
                  '    motherName: row.mother_name,\n    tattooDescription: row.tattoo_description,\n    city: row.city,'
              ),
              (
                  'mother_name: clean(form.get("motherName")) || null, city:',
                  'mother_name: clean(form.get("motherName")) || null, tattoo_description: clean(form.get("tattooDescription")) || null, city:'
              ),
              (
                  '      mother_name: clean(form.get("motherName")) || null,\n      city:',
                  '      mother_name: clean(form.get("motherName")) || null,\n      tattoo_description: clean(form.get("tattooDescription")) || null,\n      city:'
              ),
          ]
          api_changed = False
          for old, new in api_replacements:
              if old in a:
                  a = a.replace(old, new, 1)
                  api_changed = True
          if api_changed:
              api.write_text(a)
      - name: Commit requested source changes
        run: |
          if git diff --quiet -- app/sicc-app.tsx supabase/functions/sicc-api/index.ts; then
            echo "No source changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/sicc-app.tsx supabase/functions/sicc-api/index.ts
            git commit -m "fix(ui): restore tattoo description under image dates"
            git push
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sicc/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check frontend
        run: npm run typecheck
      - name: Test Infoseg parser
        run: npm run test:parser
      - name: Build static frontend
        run: npm run build:pages
      - name: Mark artifact as static
        run: touch ../pages-dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
