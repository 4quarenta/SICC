name: Deploy SICC to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sicc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply requested source changes
        shell: python
        run: |
          from pathlib import Path

          app = Path("app/sicc-app.tsx")
          s = app.read_text()

          register_field = '<label className="wide">Descrição de tatuagens<textarea name="tattooDescription" rows={3} value={registerDraft.tattooDescription} onChange={(event) => setRegisterDraft((draft) => ({ ...draft, tattooDescription: event.target.value }))} placeholder="Ex.: coroa com nome Miguel no pescoço" /></label>'
          edit_field = '<label className="wide">Descrição de tatuagens<textarea name="tattooDescription" rows={3} defaultValue={person.tattooDescription ?? ""} placeholder="Descreva tatuagens conhecidas" /></label>'

          changed = False

          # Remove the tattoo-description field from Identification, if present.
          for field in (register_field, edit_field):
              token = field + '\n'
              if token in s:
                  s = s.replace(token, '', 1)
                  changed = True

          # Place it directly below the image/date controls on new registration.
          register_photos = '''              <div className="photo-grid">
                <div className="photo-record"><PhotoInput name="facePhotos" label="Fotos do rosto" multiple /><label>Data das fotos *<input name="facePhotoDate" type="date" defaultValue={currentBrasiliaDate()} required /></label></div>
                <div className="photo-record"><PhotoInput name="tattoos" label="Fotos de tatuagens" multiple /><label>Data das fotos<input name="tattooPhotoDate" type="date" defaultValue={currentBrasiliaDate()} /></label></div>
              </div>'''
          register_photos_with_description = register_photos + '\n              ' + register_field
          if register_photos in s and register_photos_with_description not in s:
              s = s.replace(register_photos, register_photos_with_description, 1)
              changed = True

          # Do the same in the edit form.
          edit_photos = '''          <div className="photo-grid">
            <div className="photo-record"><PhotoInput name="facePhotos" label="Adicionar fotos do rosto" multiple /><label>Data das fotos<input name="facePhotoDate" type="date" defaultValue={currentBrasiliaDate()} /></label></div>
            <div className="photo-record"><PhotoInput name="tattoos" label="Adicionar tatuagens" multiple /><label>Data das fotos<input name="tattooPhotoDate" type="date" defaultValue={currentBrasiliaDate()} /></label></div>
          </div>'''
          edit_photos_with_description = edit_photos + '\n          ' + edit_field
          if edit_photos in s and edit_photos_with_description not in s:
              s = s.replace(edit_photos, edit_photos_with_description, 1)
              changed = True

          if changed:
              app.write_text(s)

      - name: Commit requested source changes
        run: |
          if git diff --quiet -- app/sicc-app.tsx; then
            echo "No source changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/sicc-app.tsx
            git commit -m "chore(ui): move tattoo description below image dates"
            git push
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sicc/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check frontend
        run: npm run typecheck
      - name: Test Infoseg parser
        run: npm run test:parser
      - name: Build static frontend
        run: npm run build:pages
      - name: Mark artifact as static
        run: touch ../pages-dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
